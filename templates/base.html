{% load static %}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CodeLens{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/ide.css' %}?v={{ asset_version }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"><i class="bi bi-bullseye"></i></span>
      <span>CodeLens</span>
      <span class="brand-tag">RAG</span>
    </a>
    {% block header_actions %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/common.js' %}?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
